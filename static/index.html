<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unce GPT</title><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script><style>
:root{font-family:Inter,system-ui,sans-serif;color:#e9e9e9;background:#212121}*{box-sizing:border-box}body{margin:0;display:flex;height:100dvh}button,input,textarea,select{font:inherit}button{cursor:pointer}aside{width:260px;background:#171717;display:flex;flex-direction:column;padding:16px;gap:12px;flex-shrink:0}aside button,.sidebaritem{border:0;background:transparent;color:#eee;text-align:left;padding:11px;border-radius:9px}.sidebaritem:hover,aside button:hover{background:#303030}#chats{overflow:auto;flex:1}.sidebaritem{display:flex;justify-content:space-between;gap:8px;font-size:14px}main{flex:1;min-width:0;display:flex;flex-direction:column}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px}header button,.ghost{background:none;border:0;color:#ddd;padding:9px;border-radius:9px}header button:hover,.ghost:hover{background:#333}#conversation{overflow-y:auto;flex:1;padding:30px 20px}#messages{max-width:790px;margin:auto;display:flex;flex-direction:column;gap:24px}.message{line-height:1.7;overflow-wrap:anywhere}.message.user{align-self:flex-end;max-width:80%;background:#303030;border-radius:22px;padding:11px 18px}.message.ai{width:100%}.message pre{background:#111;padding:16px;border-radius:12px;overflow:auto}.message code{font-family:monospace}.message p:first-child{margin-top:0}.message p:last-child{margin-bottom:0}#welcome{text-align:center;margin:13vh auto 0;font-size:30px;font-weight:600}.bottom{padding:12px 20px 24px}.composer{max-width:790px;margin:auto;background:#303030;border-radius:25px;padding:14px;box-shadow:0 3px 12px #0002}textarea{resize:none;min-height:44px;max-height:180px;width:100%;border:0;background:transparent;color:#fff;outline:none;padding:10px}textarea::placeholder{color:#aaa}.tools{display:flex;align-items:center;gap:8px}.tools button{background:#414141;color:#eee;border:0;border-radius:30px;padding:9px 13px}.tools .send{margin-left:auto;background:#eee;color:#171717;font-weight:bold}#attachments{font-size:12px;color:#bdbdbd;display:flex;gap:7px;flex-wrap:wrap}.chip{background:#454545;padding:5px 9px;border-radius:9px}dialog{background:#282828;color:#fff;border:1px solid #444;border-radius:18px;width:min(560px,94vw);padding:22px}dialog::backdrop{background:#0009}label{display:block;margin:14px 0 6px;font-size:13px;color:#bbb}dialog input,dialog select,dialog textarea{width:100%;background:#171717;border:1px solid #555;border-radius:9px;color:white;padding:10px}dialog textarea{height:90px}#workspace{display:none;position:absolute;right:0;top:64px;bottom:0;width:min(520px,100%);background:#191919;border-left:1px solid #444;padding:18px;overflow:auto;z-index:3}#workspace pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#filelist button{display:block;color:#ddd;background:#303030;border:0;margin:7px 0;padding:8px;border-radius:7px;width:100%;text-align:left}@media(max-width:700px){aside{position:absolute;z-index:5;height:100%;transform:translateX(-100%);transition:transform .2s}aside.open{transform:translateX(0)}#conversation{padding:20px 14px}.bottom{padding:10px}.message.user{max-width:95%}#welcome{font-size:24px}}
</style></head><body><aside id="sidebar"><button onclick="newChat()">✎ &nbsp; New chat</button><div style="font-size:12px;color:#999;padding:8px">Recent conversations</div><div id="chats"></div><button onclick="settings.showModal()">⚙ Settings</button></aside><main><header><div><button onclick="sidebar.classList.toggle('open')">☰</button> <b>Unce GPT</b> <span style="color:#aaa;font-size:12px">Pro</span></div><div><button onclick="showWorkspace()">⌘ Workspace</button><button onclick="settings.showModal()">⚙</button></div></header><section id="conversation"><div id="messages"><div id="welcome">What can I help you build?</div></div></section><div class="bottom"><div class="composer"><div id="attachments"></div><textarea id="prompt" placeholder="Message Unce GPT..." rows="2"></textarea><div class="tools"><button onclick="uploadInput.click()">＋ Attach</button><button onclick="showWorkspace()">Files</button><span id="status" style="font-size:12px;color:#aaa"></span><button class="send" id="send" onclick="sendMessage()">↑</button></div></div></div></main><input type="file" id="uploadInput" multiple hidden onchange="uploadFiles(this.files)"><section id="workspace"><button class="ghost" onclick="showWorkspace()">✕ Close</button><h2>Project workspace</h2><p style="color:#aaa;font-size:13px">Upload files or ZIP projects, browse extracted filenames and inspect their text.</p><div id="filelist"></div><h3 id="filename"></h3><pre id="filecontent"></pre></section><dialog id="settings"><h2>Settings</h2><label>Provider</label><select id="provider"><option value="ollama">Local Ollama</option><option value="openrouter">OpenRouter</option></select><label>Model name</label><input id="model" placeholder="llama3.2"><button class="ghost" onclick="loadModels()">Find local models</button><div id="models"></div><label>OpenRouter API key (session only)</label><input id="key" type="password" placeholder="sk-or-..."><label>Custom instructions</label><textarea id="instructions" placeholder="Preferred answer style..."></textarea><label>Temperature</label><input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7"><p style="font-size:12px;color:#aaa">API key stays in this browser tab and is sent to your local server for requests. Avoid exposing this server publicly.</p><button onclick="saveSettings();settings.close()">Save settings</button></dialog><script>
let cid=null,attached=[],busy=false,aborter=null;const $=id=>document.getElementById(id);const sidebar=$('sidebar'),settings=$('settings'),uploadInput=$('uploadInput');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(s){return DOMPurify.sanitize(marked.parse(s||''))}function add(role,s){$('welcome')?.remove();const e=document.createElement('article');e.className='message '+role;e.innerHTML=render(s);$('messages').append(e);$('conversation').scrollTop=$('conversation').scrollHeight;return e}async function refresh(){let r=await fetch('/api/chats');let data=await r.json();$('chats').innerHTML='';for(let x of data){let e=document.createElement('div');e.className='sidebaritem';let b=document.createElement('button');b.textContent=x.title;b.style='flex:1;overflow:hidden;text-overflow:ellipsis';b.onclick=()=>openChat(x.id);let d=document.createElement('button');d.textContent='×';d.onclick=async()=>{await fetch('/api/chats/'+x.id,{method:'DELETE'});if(cid===x.id)newChat();refresh()};e.append(b,d);$('chats').append(e)}}function newChat(){cid=null;attached=[];$('attachments').innerHTML='';$('messages').innerHTML='<div id="welcome">What can I help you build?</div>';sidebar.classList.remove('open')}async function openChat(id){cid=id;let data=await(await fetch('/api/chats/'+id)).json();$('messages').innerHTML='';for(let x of data)add(x.role==='user'?'user':'ai',x.content);sidebar.classList.remove('open')}function saveSettings(){for(let k of ['provider','model','instructions','temperature'])localStorage.setItem('unce_'+k,$(k).value)}for(let k of ['provider','model','instructions','temperature'])if(localStorage.getItem('unce_'+k)!==null)$(k).value=localStorage.getItem('unce_'+k);async function loadModels(){let d=await(await fetch('/api/models')).json();$('models').textContent=(d.models||[]).map(x=>x.name).join(', ')||'No local models detected'}async function uploadFiles(files){for(let file of files){$('status').textContent='Uploading '+file.name;let f=new FormData();f.append('file',file);try{let r=await fetch('/api/upload',{method:'POST',body:f});let d=await r.json();if(!r.ok)throw Error(d.detail);attached.push(d.id);let chip=document.createElement('span');chip.className='chip';chip.textContent=d.name;$('attachments').append(chip)}catch(e){alert(e.message)}}$('status').textContent='';refreshFiles()}async function refreshFiles(){let data=await(await fetch('/api/files')).json();$('filelist').innerHTML='';for(let x of data){let b=document.createElement('button');b.textContent='📄 '+x.name;b.onclick=()=>openFile(x.id);$('filelist').append(b)}}async function openFile(id){let d=await(await fetch('/api/files/'+id)).json();$('filename').textContent=d.name;$('filecontent').textContent='Archive entries:\n'+JSON.parse(d.tree).join('\n')+'\n\n'+d.content}function showWorkspace(){let e=$('workspace');e.style.display=e.style.display==='block'?'none':'block';refreshFiles()}async function sendMessage(){if(busy){aborter?.abort();return}let prompt=$('prompt').value.trim();if(!prompt)return;$('prompt').value='';add('user',prompt);let node=add('ai','');busy=true;aborter=new AbortController();$('send').textContent='■';$('status').textContent='Thinking...';let output='';try{let r=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:cid,prompt,file_ids:attached,provider:$('provider').value,model:$('model').value,api_key:$('key').value,instructions:$('instructions').value,temperature:Number($('temperature').value)}),signal:aborter.signal});if(!r.ok)throw Error('HTTP '+r.status);let reader=r.body.getReader(),decoder=new TextDecoder(),buffer='';while(true){let {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let lines=buffer.split('\n');buffer=lines.pop();for(let line of lines){if(!line)continue;let ev=JSON.parse(line);if(ev.type==='start'){cid=ev.chat_id;refresh()}if(ev.type==='delta'){output+=ev.text;node.innerHTML=render(output);$('conversation').scrollTop=$('conversation').scrollHeight}if(ev.type==='error')throw Error(ev.message)}}}catch(e){node.innerHTML=render(output+'\n\n'+(e.name==='AbortError'?'[Stopped]':'Error: '+e.message))}finally{busy=false;aborter=null;$('send').textContent='↑';$('status').textContent='';attached=[];$('attachments').innerHTML='';refresh()}}$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});refresh();refreshFiles();</script></body></html>
